{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "auto-merge.serviceAccountName" . }}
  labels:
    {{- include "auto-merge.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/* Disable token automount: the app never calls the k8s API, so the mounted token is only an attack surface. */}}
automountServiceAccountToken: false
{{- end }}
