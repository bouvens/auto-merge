name: Release

on:
  push:
    tags: ["v*.*.*"]

# Prevent two tag pushes from racing; cancel-in-progress=false ensures both complete
# rather than aborting a near-simultaneous release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# id-token: write is required by cosign keyless OIDC (merge job mints the ephemeral Fulcio cert).
# packages: write is required to push images and manifest lists to GHCR.
# contents: read is the minimum needed for checkout.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            # Native ARM runner avoids QEMU emulation, which is 5-10x slower and
            # has known incompatibilities with some Node.js native addons (REL-01).
            runner: ubuntu-24.04-arm
            suffix: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Buildx is required even on single-platform builds when using push-by-digest
      # outputs — the classic docker build does not support the type=image output driver.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7.2.0
        with:
          push: true
          platforms: ${{ matrix.platform }}
          # mode=max attaches the full build graph to the provenance attestation (SLSA L3).
          # mode=min (the default for public repos) omits the build arguments and
          # environment, making the attestation insufficient for policy engines.
          provenance: mode=max
          # SBOM is generated by buildx at build time and attached as an OCI referrer;
          # no separate syft/grype invocation is needed.
          sbom: true
          # push-by-digest=true pushes without a tag — the manifest list is assembled
          # later by imagetools create in the merge job, avoiding race conditions when
          # both arch builds try to write the same tag simultaneously.
          outputs: type=image,push-by-digest=true,name=ghcr.io/${{ github.repository }}

      # Store the per-arch digest as an empty file named after the sha256 hex.
      # The merge job reads all files from /tmp/digests to enumerate source refs.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          # Artifact name must be unique per matrix leg to avoid collisions (Pitfall 8).
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          # Merge artifacts from both legs into a single flat directory so that
          # the printf glob below expands to both digest filenames.
          merge-multiple: true
          pattern: digest-*

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            # Attach :latest unconditionally on every tag push (REL-01 requirement).
            # Tags are only pushed when the workflow is triggered by v*.*.* — there is
            # no branch context, so enable={{is_default_branch}} would always be false.
            type=raw,value=latest

      # Assemble the multi-arch manifest list from the per-arch digests uploaded above.
      # jq expands the metadata-action JSON into individual -t <tag> flags.
      # printf expands the digest filenames into ghcr.io/<repo>@sha256:<hex> refs.
      - name: Create multi-arch manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      # Extract the manifest-list digest AFTER imagetools create so we sign the final
      # multi-arch manifest, not one of the per-arch digests (Pitfall 2 / T-11-06).
      - id: inspect
        name: Extract manifest-list digest
        run: |
          digest=$(
            docker buildx imagetools inspect \
              "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}" \
              --format '{{json .Manifest}}' \
              | jq -r '.digest'
          )
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # cosign-installer@v4.1.2 is required — v3 cannot install Cosign 3.x and would
      # fail on the --yes flag and updated certificate flags (RESEARCH.md Pitfall 1 / T-11-05).
      - uses: sigstore/cosign-installer@v4.1.2

      # Sign using keyless OIDC: GHA mints an ephemeral Fulcio cert bound to this
      # workflow's OIDC token; Rekor logs the signature for auditability.
      # We sign <tag>@<manifest-list-digest> for every tag so cosign verify works
      # against both the semver tag and the sha- tag.
      - name: Sign container image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
